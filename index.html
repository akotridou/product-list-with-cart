<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Product list with cart</title>
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 40px; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <h1>Desserts</h1>

  <main class="container">
   
    <div id="products"></div>

   
    <div id="cart">
      <h2 id="cardh2">Your Cart (<span id="count">0</span>)</h2>
      
     
      <div class="empty-cart">
        <img src="./assets/images/illustration-empty-cart.svg" alt="Empty cart">
        <p>Your added items will appear here</p>
      </div>

    
      <div id="cart-items"></div>

      
      <div id="cart-bottom" style="display: none;">
        <div class="order-total">
          <span>Order Total</span>
          <span class="total-price-all">$0.00</span>
        </div>

        <div class="carbon-delivery">
          <img src="./assets/images/icon-carbon-neutral.svg" alt="">
          <p>This is a <strong>carbon-neutral</strong> delivery</p>
        </div>

        <button class="btn-confirm">Confirm Order</button>
      </div>
    </div>
  </main>

  
  <div class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <img src="./assets/images/icon-order-confirmed.svg" alt="Confirmed" class="modal-icon">
      <h2>Order Confirmed</h2>
      <p class="modal-subtitle">We hope you enjoy your food!</p>

      <div class="modal-summary-box">
        <div id="modal-items"></div>
        <div class="modal-total-row">
          <span>Order Total</span>
          <span class="modal-grand-total">$0.00</span>
        </div>
      </div>

      <button class="btn-new-order">Start New Order</button>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Anthimi</a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
